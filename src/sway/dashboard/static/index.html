<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Locks the page down to exactly what it needs: its own scripts, its own
     stylesheet, and requests back to its own origin. The window renders the
     user's dictation history, so an injected *external* request is the one
     thing that could carry it off the machine -- which is what default-src
     'none' and connect-src 'self' exist to stop.

     style-src carries 'unsafe-inline' deliberately. The UI is rendered by
     building markup in app.js, and layout values that depend on data (a
     progress width, a bar height) arrive as style attributes; without this
     every one of them is silently dropped and the page renders subtly and
     confusingly wrong. It costs little here: CSS-based exfiltration needs an
     external URL to send to, and default-src 'none' already forbids one.
     script-src stays strict, which is the directive that matters. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>Sway</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

    <g id="i-copy"><rect x="7" y="7" width="9.5" height="9.5" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M13 4.5H5.5a1.5 1.5 0 0 0-1.5 1.5V13" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></g>

    <g id="i-plus"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></g>
    <g id="i-back"><path d="M15 10H5M9 5l-5 5 5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-check"><path d="M4.5 10.5 8 14l7.5-8" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>

</svg>

<a class="skip-link" href="#page">Skip to content</a>

<div class="app" id="app">

    <div class="brand">

      <span class="brand-name">Sway</span>
    </div>

    <button class="nav-item" data-view="home"><svg viewBox="0 0 20 20"><use href="#i-home"/></svg> Home</button>
    <button class="nav-item" data-view="history"><svg viewBox="0 0 20 20"><use href="#i-history"/></svg> History</button>
    <button class="nav-item" data-view="dictionary"><svg viewBox="0 0 20 20"><use href="#i-book"/></svg> Dictionary</button>
    <button class="nav-item" data-view="snippets">
      <svg viewBox="0 0 20 20"><use href="#i-snippet"/></svg> Snippets
      <span class="count" id="snippets-count"></span>
    </button>
    <button class="nav-item" data-view="insights"><svg viewBox="0 0 20 20"><use href="#i-chart"/></svg> Insights</button>

    <div class="nav-divider"></div>

    <button class="nav-item" data-view="settings">
      <svg viewBox="0 0 20 20"><use href="#i-gear"/></svg> Settings
      <span class="count" id="settings-count"></span>
    </button>
    <button class="nav-item" data-view="about"><svg viewBox="0 0 20 20"><use href="#i-info"/></svg> About</button>
  </nav>

  <main class="main" id="main">
    <div class="page" id="page"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Dictation detail">
  <div class="drawer-head">
    <div class="grow" style="flex:1">
      <div class="page-title" style="font-size:20px" id="drawer-title">Dictation</div>
      <div class="small muted" id="drawer-sub"></div>
    </div>
    <button class="icon-btn" id="drawer-close" aria-label="Close"><svg viewBox="0 0 20 20"><use href="#i-x"/></svg></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="modal-scrim" id="modal-scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><div class="modal-title" id="modal-title"></div></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="onboard hidden" id="onboard">
  <div class="rail" id="rail"></div>
  <div class="onboard-body" id="onboard-body"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
